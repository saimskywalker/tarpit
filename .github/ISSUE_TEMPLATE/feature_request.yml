name: Feature request or new rule
description: Suggest a rule backed by a widget test that hangs, a watchdog improvement, or a CLI feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A new rule needs a reproduction. See "Adding a rule" in
        [CONTRIBUTING.md](https://github.com/saimskywalker/tarpit/blob/main/CONTRIBUTING.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Checker rule
        - Watchdog
        - CLI or output formats
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The hang or failure, or what you want tarpit to do.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction
      description: The smallest testWidgets that hangs, and links to Flutter issues or docs that explain it.
      render: dart
  - type: textarea
    id: proposal
    attributes:
      label: Proposed check or behaviour
  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use an AI tool to write this issue?
      options:
        - "No"
        - "Yes, for parts"
        - "Yes, mostly"
    validations:
      required: true
  - type: input
    id: ai-tool
    attributes:
      label: If yes, which tool and model?
      description: Required if you answered yes above, for example "Claude Code, Opus 5.5" or "Copilot, GPT-5".
  - type: checkboxes
    id: own-words
    attributes:
      label: Your own words
      description: Please write the issue in your own words; short and plain is fine. It shows us what you understood. Please don't paste generated text.
      options:
        - label: I wrote this issue in my own words.
