name: Tests required

# A change to lib/ or bin/ must come with a test change. A maintainer can waive
# this with the no-tests-needed label (only maintainers can add labels).
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  tests:
    name: tests required
    runs-on: ubuntu-latest
    steps:
      - if: "!contains(github.event.pull_request.labels.*.name, 'no-tests-needed')"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')"
          if grep -Eq '^(lib|bin)/' <<<"$files" && ! grep -Eq '^(example/)?test/' <<<"$files"; then
            echo "::error title=Tests required::This PR changes lib/ or bin/ but no test. Add a test under test/ (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "Tests present, or no code change."
