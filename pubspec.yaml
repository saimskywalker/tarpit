name: tarpit
description: >-
  Find widget-test code that can hang in FakeAsync, and fail a stalled
  testWidgets fast. An analyzer-based CLI (text, JSON, SARIF) plus a watchdog.
version: 0.1.1
repository: https://github.com/saimskywalker/tarpit
issue_tracker: https://github.com/saimskywalker/tarpit/issues
topics:
  - testing
  - flutter
  - lint
  - ci
  - static-analysis

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

executables:
  tarpit:

dependencies:
  analyzer: '>=13.0.0 <15.0.0'
  args: ^2.7.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  meta: ^1.18.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
